name: generate trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  trophy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: iamjoyeb
          file: trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: commit trophy
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add trophy.svg
          git commit -m "update trophy" || echo "no changes"
          git push